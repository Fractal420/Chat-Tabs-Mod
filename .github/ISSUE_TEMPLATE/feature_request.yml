name: Feature request
description: Suggest an idea or improvement for the mod
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement.
      placeholder: I would like the mod to...
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Why would this be useful?
      placeholder: This would help because...
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to make sure this hasn't already been suggested.
          required: true
