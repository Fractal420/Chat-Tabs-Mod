name: Other
description: Something that doesn't fit the other categories
title: "[Other]: "
labels:
  - other
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like to report?
      placeholder: Tell us what's going on...
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to make sure this isn't already covered.
          required: true
