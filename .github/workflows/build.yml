name: build

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'versions/**'
      - 'fabricWrapper/src/**'
      - 'fabricWrapper/build.gradle.kts'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  pull_request:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'versions/**'
      - 'fabricWrapper/src/**'
      - 'fabricWrapper/build.gradle.kts'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:

env:
  IS_THIS_RELEASE: false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRADLE_OPTS: --sun-misc-unsafe-memory-access=allow

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Loom workspace
        uses: actions/cache@v5
        with:
          path: |
            ./.gradle/loom-cache
            ./libs
          key: ${{ runner.os }}-loom-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', '**/gradle.properties', 'buildSrc/**') }}
          restore-keys: |
            ${{ runner.os }}-loom-

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build fabricWrapper subproject
        run: ./gradlew :fabricWrapper:build -x test --stacktrace --console=plain

      - name: Delete wrapper sources jar
        run: |
          find fabricWrapper/build/libs/ -name "*-sources.jar" -delete || true

      - name: Capture versionpack
        uses: actions/upload-artifact@v7
        with:
          name: versionpack
          path: fabricWrapper/build/libs/*.jar
          if-no-files-found: error
          retention-days: 1
          archive: false

      - name: Capture standalone version JARs
        uses: actions/upload-artifact@v7
        with:
          name: version-jars
          path: |
            versions/*/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 1
